# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: repolens-ai
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: "8000"
      - key: LLM_PROVIDER
        value: gemini
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false   # Enter securely in the Render dashboard
